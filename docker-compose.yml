services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mini_doodle
      SPRING_DATASOURCE_USERNAME: mini_doodle
      SPRING_DATASOURCE_PASSWORD: mini_doodle
      APP_CORS_ALLOWED_ORIGINS: ${SWAGGER_UI_ORIGIN:-http://localhost:8081}
    depends_on:
      postgres:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8081:8080"
    environment:
      URL: ${SWAGGER_OPENAPI_URL:-http://localhost:8080/v3/api-docs}
      VALIDATOR_URL: none
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_doodle
      POSTGRES_USER: mini_doodle
      POSTGRES_PASSWORD: mini_doodle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_doodle -d mini_doodle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
